name: Update data and deploy site

on:
  schedule:
    - cron: "17 */6 * * *"   # alle 6h, bewusst off-minute
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true   # GITHUB_TOKEN der Actions-Runner (hat repo-Scope)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect data
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: python collector.py

      - name: Build site
        run: python build_site.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "free-llm-tracker bot"
          git config user.email "harrytyp@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4